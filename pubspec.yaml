name: scholar_calendar
description: Calendario escolar para gestionar asignaturas, eventos y alarmas.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  syncfusion_flutter_calendar: ^35.1.42
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_speed_dial: ^7.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  intl: ^0.20.2
  flex_color_picker: ^3.7.1
  rxdart: ^0.28.0
  get: ^4.7.2
  flutter_slidable: ^3.1.2
  animate_do: ^4.2.0
  feature_discovery: ^0.14.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#06296b"
  image: assets/images/icon256x256.png
  color_dark: "#272727"
  image_dark: assets/images/icon256x256.png
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon.png
    - assets/images/icon256x256.png
    - assets/images/drawer_header.jpg
